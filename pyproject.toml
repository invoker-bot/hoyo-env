[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hoyo-env"
version = "0.1.1"
description = "米哈游游戏版本管理器：安装、切换、启动 hk4e / hkrpg / nap / bh3。下载集中存放，未改动文件不重复占用空间。"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Qingrui Hu", email = "invoker-bot@outlook.com" }]
keywords = ["hoyo", "hoyo-env", "mihoyo", "hk4e", "hkrpg", "nap", "bh3", "genshin", "version-manager", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13",
    "typer>=0.12",
    "zstandard>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/invoker-bot/hoyo-env"
Repository = "https://github.com/invoker-bot/hoyo-env"
Issues = "https://github.com/invoker-bot/hoyo-env/issues"

[project.scripts]
hoyo = "hoyo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hoyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
